    --gold: #f5c842;
    --gold-dim: #8a7020;
    --red: #e63946;
    --red-dim: #7c1c22;
    --blue: #3b82f6;
    --text: #e2e8f0;
    --text-dim: #64748b;
    --good: #10b981;
    --bad: #ef4444;
    --neutral: #6366f1;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
  }

  /* Ambient background layer */
  #ambient {
    position: fixed;
    inset: 0;
    pointer-events: none;
    transition: background 2s ease;
    z-index: 0;
  }

  #game-container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 780px;
    padding: 20px;
  }

  /* ── SCREENS ── */
  .screen { display: none; }
  .screen.active { display: flex; flex-direction: column; }

  /* ── TITLE SCREEN ── */
  #title-screen {
    position: relative;
    align-items: center;
    justify-content: center;
    min-height: 90vh;
    text-align: center;
    gap: 0;
  }

  .title-bg {
    position: fixed;
    inset: 0;
    background-image: var(--title-bg-image);
    background-size: cover;
    background-position: center;
    opacity: 0.3;
    filter: brightness(0.4);
    z-index: -1;
  }

  .title-art {
    font-size: 13px;
    line-height: 1.3;
    color: var(--gold);
    font-family: 'Space Mono', monospace;
    margin-bottom: 32px;
    opacity: 0;
    animation: fadeUp 1s ease 0.3s forwards;
    white-space: pre;
  }

  .game-title {
    font-family: 'Space Mono', monospace;
    font-size: clamp(28px, 6vw, 52px);
    font-weight: 700;
    letter-spacing: -1px;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.8s forwards;
  }
  .game-title { color: var(--gold); }

  .subtitle {
    font-size: 15px;
    color: var(--text-dim);
    margin-top: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeUp 0.8s ease 1.1s forwards;
  }

  .path-visual {
    display: flex;
    gap: 40px;
    margin: 40px 0 32px;
    opacity: 0;
    animation: fadeUp 0.8s ease 1.4s forwards;
  }
  .path-dot {
    width: 14px; height: 14px; border-radius: 50%;
    animation: pulse 2s ease infinite;
  }
  .path-dot.good { background: var(--good); animation-delay: 0s; }
  .path-dot.bad  { background: var(--bad);  animation-delay: 1s; }

  .btn-start {
    padding: 16px 48px;
    background: var(--gold);
    color: #1a0509;
    border: none;
    font-family: 'Space Mono', monospace;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 1px;
    clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
    transition: transform 0.15s, box-shadow 0.15s;
    opacity: 0;
    animation: fadeUp 0.8s ease 1.7s forwards;
  }
  .btn-start:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(245,200,66,0.35); }

  /* ── GAME SCREEN ── */
  #game-screen { gap: 20px; min-height: 90vh; justify-content: center; }

  /* Score bar */
  .score-bar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
  }
  .score-label { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: var(--text-dim); }
  .karma-track {
    flex: 1;
    height: 8px;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
    position: relative;
  }
  .karma-fill {
    height: 100%;
    width: 50%;
    border-radius: 4px;
    transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.8s ease;
    background: var(--neutral);
  }
  .step-counter {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
    white-space: nowrap;
  }

  /* Scene card */
  .scene-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    animation: slideIn 0.4s ease;
  }

  .scene-header {
    padding: 16px 24px;
    background: rgba(255,255,255,0.03);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .scene-icon { font-size: 22px; }
  .scene-location {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--text-dim);
  }

  .scene-body { padding: 28px 28px 24px; }

  .character-name {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--gold);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 10px;
  }

  .scene-text {
    font-size: 16px;
    line-height: 1.8;
    color: var(--text);
  }

  .scene-context {
    margin-top: 16px;
    padding: 14px 16px;
    background: rgba(255,255,255,0.04);
    border-left: 3px solid var(--gold);
    border-radius: 0 4px 4px 0;
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.6;
    font-style: italic;
  }

  /* Choices */
  .choices-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: var(--text-dim);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .choices-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .choices-grid { display: flex; flex-direction: column; gap: 10px; }

  .choice-btn {
    padding: 18px 22px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    cursor: pointer;
    text-align: left;
    transition: all 0.2s ease;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    line-height: 1.5;
  }
  .choice-btn:hover { border-color: var(--gold); background: rgba(245,200,66,0.07); transform: translateX(4px); }
  .choice-btn:hover .choice-arrow { opacity: 1; transform: translateX(0); }

  .choice-letter {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    color: var(--gold);
    min-width: 24px;
    margin-top: 2px;
    background: rgba(245,200,66,0.12);
    padding: 2px 6px;
    border-radius: 3px;
  }

  .choice-arrow {
    margin-left: auto;
    opacity: 0;
    transform: translateX(-8px);
    transition: all 0.2s ease;
    color: var(--gold);
    font-size: 18px;

function shuffleArray(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

}

function renderScenario() {
  const s = SCENARIOS[currentStep];
  document.getElementById('scene-icon').textContent = s.icon;
  document.getElementById('scene-location').textContent = s.location;
  document.getElementById('scene-text').textContent = s.text;
  document.getElementById('scene-context').textContent = s.context;
  document.getElementById('step-counter').textContent = `${currentStep + 1} / ${SCENARIOS.length}`;
  updateKarmaBar();

  const grid = document.getElementById('choices-grid');
  grid.innerHTML = '';
  const letters = ['A', 'B', 'C'];
  const shuffledChoices = shuffleArray(s.choices);
  shuffledChoices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = `<span class="choice-letter">${letters[i]}</span><span>${c.text}</span><span class="choice-arrow">→</span>`;
    btn.onclick = () => makeChoice(c);
    grid.appendChild(btn);
  });

  // Re-animate card
  const card = document.getElementById('scene-card');
  card.style.animation = 'none';
  void card.offsetWidth;
  card.style.animation = 'slideIn 0.4s ease';
}

function makeChoice(choice) {
  if (feedbackVisible) return;
  feedbackVisible = true;

  let delta = 0;
  if (choice.type === 'good') delta = 18;
  else if (choice.type === 'bad') delta = -18;
  else if (choice.type === 'neutral') delta = 9;
  karma = Math.max(0, Math.min(100, karma + delta));
  decisions.push({ text: choice.text, type: choice.type, step: currentStep + 1 });
  updateKarmaBar();
  updateAmbient();
  showFeedback(choice);
}

function showFeedback(choice) {
  const f = choice.feedback;
  let typeLabel;
  if (choice.type === 'good') typeLabel = '✓ Buena decisión';
  else if (choice.type === 'bad') typeLabel = '✗ Consecuencia negativa';
  else typeLabel = '➜ Decisión intermedia';
  const overlay = document.createElement('div');
  overlay.className = 'feedback-overlay';
  overlay.innerHTML = `
    <div class="feedback-card">
      <div class="feedback-icon">${f.icon}</div>
      <div class="feedback-type ${choice.type}">${typeLabel}</div>
      <div class="feedback-msg">${f.msg}</div>
      <div class="feedback-lesson">💡 ${f.lesson}</div>
      <button class="btn-continue" onclick="nextStep(this)">${currentStep < SCENARIOS.length - 1 ? 'Siguiente situación →' : 'Ver resultado final →'}</button>
    </div>`;
  document.body.appendChild(overlay);
}

function nextStep(btn) {
  const overlay = btn.closest('.feedback-overlay');
  overlay.remove();
  feedbackVisible = false;
  currentStep++;
  if (currentStep >= SCENARIOS.length) {
    showEndScreen();
  } else {
    renderScenario();
  }
}

function updateKarmaBar() {
  const fill = document.getElementById('karma-fill');
  fill.style.width = karma + '%';
  if (karma > 65) fill.style.background = 'linear-gradient(90deg, #059669, #10b981)';
  else if (karma < 35) fill.style.background = 'linear-gradient(90deg, #b91c1c, #ef4444)';
  else fill.style.background = 'linear-gradient(90deg, #4338ca, #6366f1)';
}

function updateAmbient() {
  const amb = document.getElementById('ambient');
  if (karma > 65) amb.style.background = 'radial-gradient(ellipse at 50% 0%, rgba(16,185,129,0.08) 0%, transparent 70%)';
  else if (karma < 35) amb.style.background = 'radial-gradient(ellipse at 50% 0%, rgba(239,68,68,0.08) 0%, transparent 70%)';
  else amb.style.background = 'radial-gradient(ellipse at 50% 0%, rgba(99,102,241,0.06) 0%, transparent 70%)';
}

function showEndScreen() {
  document.getElementById('game-screen').classList.remove('active');
  const end = document.getElementById('end-screen');
  end.classList.add('active');

  const goodCount = decisions.filter(d => d.type === 'good').length;
  const badCount = decisions.filter(d => d.type === 'bad').length;
  const neutralCount = decisions.filter(d => d.type === 'neutral').length;
  const effectiveGoodCount = goodCount + Math.floor(neutralCount / 2);
  const pct = Math.round(karma);

  let resultClass, resultTitle, resultIcon, resultMsg;
  if (effectiveGoodCount > SCENARIOS.length / 2) {
    resultClass = 'good'; resultTitle = '¡Buen Camino!'; resultIcon = '🌟';
    resultMsg = 'Tomaste decisiones pensando en el largo plazo, con honestidad y responsabilidad. Ese tipo de carácter es lo que construye una vida de la que te puedas sentir orgulloso/a.';
  } else if (badCount > SCENARIOS.length / 2) {
    resultClass = 'bad'; resultTitle = 'Camino Difícil'; resultIcon = '⚠️';
    resultMsg = 'Tus decisiones buscaron el camino más fácil a corto plazo. Las consecuencias se acumulan. Pero lo bueno es que en la vida real siempre hay oportunidad de cambiar de rumbo.';
  } else {
    resultClass = 'neutral'; resultTitle = 'Camino Incierto'; resultIcon = '🔀';
    resultMsg = 'Tus decisiones fueron mixtas — algunas buenas, algunas no tanto. La vida es así. Lo importante es reflexionar y aprender de cada una para hacerlo mejor.';
  }

  const reviewItems = decisions.map((d, i) => {
    let badgeText;
    if (d.type === 'good') badgeText = '✓ Buena';
    else if (d.type === 'bad') badgeText = '✗ Difícil';
    else badgeText = '➜ Intermedia';
    return `
    <div class="review-item">
      <div class="review-dot ${d.type}"></div>
      <span class="review-text">Situación ${d.step}</span>
      <span class="review-badge ${d.type}">${badgeText}</span>
    </div>`;
  }).join('');

  end.innerHTML = `
    <div class="end-result-icon">${resultIcon}</div>
    <div class="end-title ${resultClass}">${resultTitle}</div>
    <div>
      <div class="end-score-display" style="color:${resultClass === 'good' ? '#10b981' : resultClass === 'bad' ? '#ef4444' : '#f5c842'}">${pct}</div>
      <div class="end-score-label">puntos de karma</div>
    </div>
    <div class="end-message">${resultMsg}</div>
    <div class="decisions-review">
      <div class="review-header">Resumen de decisiones</div>
      <div class="review-list">${reviewItems}</div>
    </div>
    <button class="btn-restart" onclick="restartGame()">↺ Jugar de nuevo</button>
    <div style="font-size:12px;color:#334155;max-width:440px;line-height:1.7;text-align:center">
      Recuerda: en el juego puedes reiniciar. En la vida real, cada decisión deja huella.<br>
      <strong style="color:#475569">Elige siempre con quien quieres ser, no solo con lo que quieres evitar.</strong>
    </div>`;

  // Ambient for end
  const amb = document.getElementById('ambient');
  if (resultClass === 'good') amb.style.background = 'radial-gradient(ellipse at 50% 0%, rgba(16,185,129,0.12) 0%, transparent 70%)';
  else if (resultClass === 'bad') amb.style.background = 'radial-gradient(ellipse at 50% 0%, rgba(239,68,68,0.12) 0%, transparent 70%)';
  else amb.style.background = 'radial-gradient(ellipse at 50% 0%, rgba(245,200,66,0.1) 0%, transparent 70%)';
}

function restartGame() {
  currentStep = 0; karma = 50; decisions = []; feedbackVisible = false;
  document.getElementById('end-screen').classList.remove('active');
  document.getElementById('end-screen').innerHTML = '';
  document.getElementById('ambient').style.background = '';
  document.getElementById('game-screen').classList.add('active');
  renderScenario();
}
</script>
</body>
</html>
